name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  node-ci:
    name: Node.js CI (Core & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Core Unit Tests
        run: npm test

      - name: Typecheck Core Package
        run: cd packages/core && npx tsc --noEmit

      - name: Typecheck React Package
        run: cd packages/react && npx tsc --noEmit

      - name: Build React Web Demo
        run: npm run build:react-demo

  android-ci:
    name: Android CI (Jetpack Compose)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Android Library
        working-directory: packages/android
        run: chmod +x ./gradlew && ./gradlew build --no-daemon

  ios-ci:
    name: iOS CI (SwiftUI Package)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test Swift Package
        run: |
          cd packages/ios
          xcodebuild test -scheme IndonesianLocationAutocomplete -destination "platform=iOS Simulator,name=iPhone 15"
